<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 900" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Galeri 3 - detail bunga dan cincin">
  <defs>
    <linearGradient id="g3Bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f4ecda"/><stop offset="1" stop-color="#dccbb0"/></linearGradient>
    <linearGradient id="g3Rose" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e3c0b2"/><stop offset="1" stop-color="#b08278"/></linearGradient>
    <linearGradient id="g3Leaf" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8a9172"/><stop offset="1" stop-color="#55604a"/></linearGradient>
    <filter id="g3Grain"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="matrix" values="0 0 0 0 .4 0 0 0 0 .36 0 0 0 0 .28 0 0 0 .05 0"/></filter>
  </defs>
  <rect width="700" height="900" fill="url(#g3Bg)"/>
  <!-- close-up rose, off-centre -->
  <g transform="translate(430 320)">
    <circle r="120" fill="#f6efdf"/>
    <g fill="url(#g3Rose)">
      <circle r="110" opacity=".35"/>
      <path d="M0 -96 C60 -96 96 -52 96 0 C96 58 52 96 0 96 C-58 96 -96 54 -96 0 C-96 -54 -56 -96 0 -96" opacity=".55"/>
      <path d="M0 -66 C42 -66 66 -34 66 0 C66 38 36 66 0 66 C-40 66 -66 36 -66 0 C-66 -36 -40 -66 0 -66" opacity=".7"/>
      <path d="M0 -38 C24 -38 38 -18 38 0 C38 22 20 38 0 38 C-22 38 -38 20 -38 0 C-38 -20 -22 -38 0 -38" opacity=".85"/>
      <circle r="14"/>
    </g>
    <g stroke="#8a5f56" stroke-width="1.2" fill="none" opacity=".6">
      <path d="M-70 -46 Q-30 -66 8 -58 M62 -30 Q66 14 38 44 M-20 62 Q-58 44 -68 6 M-52 -52 Q-10 -76 36 -64"/>
    </g>
  </g>
  <!-- second smaller rose -->
  <g transform="translate(180 620)">
    <circle r="76" fill="#f6efdf"/>
    <g fill="url(#g3Rose)"><circle r="70" opacity=".4"/><path d="M0 -44 C28 -44 44 -22 44 0 C44 26 24 44 0 44 C-26 44 -44 24 -44 0 C-44 -24 -26 -44 0 -44" opacity=".7"/><circle r="10"/></g>
  </g>
  <!-- rings detail -->
  <g transform="translate(330 740)">
    <circle cx="-26" cy="0" r="34" fill="none" stroke="#c9a44e" stroke-width="7"/>
    <circle cx="30" cy="6" r="26" fill="none" stroke="#b08d42" stroke-width="6"/>
    <path d="M30 -20 l7 12 14 2 -10 10 2 14 -13 -6 -13 6 2 -14 -10 -10 14 -2 Z" fill="#c9a44e"/>
  </g>
  <!-- scattered leaves -->
  <g fill="url(#g3Leaf)" opacity=".9">
    <ellipse cx="120" cy="200" rx="34" ry="13" transform="rotate(-28 120 200)"/>
    <ellipse cx="580" cy="560" rx="30" ry="12" transform="rotate(18 580 560)"/>
    <ellipse cx="90" cy="800" rx="30" ry="12" transform="rotate(14 90 800)"/>
    <ellipse cx="620" cy="120" rx="28" ry="11" transform="rotate(30 620 120)"/>
    <ellipse cx="540" cy="820" rx="26" ry="10" transform="rotate(-20 540 820)"/>
  </g>
  <g stroke="#5d684f" stroke-width="1.6" fill="none" opacity=".8">
    <path d="M156 186 Q240 160 320 180 M604 552 Q530 540 470 560"/>
  </g>
  <rect width="700" height="900" filter="url(#g3Grain)" opacity=".5"/>
</svg>
