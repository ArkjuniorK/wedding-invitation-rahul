    <ellipse cx="96" cy="820" rx="13" ry="6" transform="rotate(16 96 820)"/>
    <ellipse cx="664" cy="790" rx="14" ry="6" transform="rotate(20 664 790)"/>
    <ellipse cx="624" cy="820" rx="13" ry="6" transform="rotate(-16 624 820)"/>
