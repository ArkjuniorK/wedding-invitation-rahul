<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 950" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Galeri 5 - jalan berdua di bawah pohon">
  <defs>
    <linearGradient id="g5Bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f0e5cf"/><stop offset="1" stop-color="#d5c5a5"/></linearGradient>
    <linearGradient id="g5Path" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e8dcc0"/><stop offset="1" stop-color="#cbb890"/></linearGradient>
    <linearGradient id="g5Leaf" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8a9172"/><stop offset="1" stop-color="#55604a"/></linearGradient>
    <filter id="g5Grain"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="matrix" values="0 0 0 0 .4 0 0 0 0 .36 0 0 0 0 .28 0 0 0 .05 0"/></filter>
  </defs>
  <rect width="760" height="950" fill="url(#g5Bg)"/>
  <!-- big tree canopy -->
  <path d="M380 40 Q140 60 120 300 Q110 480 300 520 L460 520 Q650 480 640 300 Q620 60 380 40" fill="#a8ad8c" opacity=".55"/>
