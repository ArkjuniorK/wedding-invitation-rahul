  <g>
    <path d="M368 640 V560 Q368 528 384 528 Q400 528 400 560 V640 Z" fill="#4a4238"/>
    <circle cx="384" cy="512" r="16" fill="#c9a98e"/>
    <path d="M322 640 V566 Q322 538 340 538 Q358 538 358 566 V640 Z" fill="#f7f2e8"/>
    <circle cx="340" cy="524" r="15" fill="#c9a98e"/>
    <path d="M340 508 q-16 2 -17 20 q8 -10 17 -10 q9 0 17 10 q-1 -18 -17 -20" fill="#6b4f3a"/>
