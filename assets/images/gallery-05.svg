  </g>
  <!-- path -->
  <path d="M300 950 Q320 700 360 560 H400 Q440 700 460 950 Z" fill="url(#g5Path)"/>
  <g stroke="#b9a67e" stroke-width="2" fill="none" opacity=".7">
    <path d="M330 880 Q380 870 430 880 M322 800 Q380 790 438 800 M338 720 Q380 712 424 720 M348 650 Q380 644 414 650 M356 596 Q380 592 406 596"/>
  </g>
