<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Galeri 8 - first dance under string lights">
  <defs>
    <linearGradient id="g8Bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3d362c"/><stop offset="1" stop-color="#2b2620"/></linearGradient>
    <linearGradient id="g8Glow" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6e2ae"/><stop offset="1" stop-color="#e8b96a"/></linearGradient>
    <linearGradient id="g8Gown" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fbf7ee"/><stop offset="1" stop-color="#ddd0b4"/></linearGradient>
    <filter id="g8Grain"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="matrix" values="0 0 0 0 .9 0 0 0 0 .85 0 0 0 0 .7 0 0 0 .06 0"/></filter>
  </defs>
  <rect width="900" height="640" fill="url(#g8Bg)"/>
  <!-- string lights -->
  <g stroke="#8a7a5e" stroke-width="1.6" fill="none" opacity=".9">
    <path d="M0 90 Q225 150 450 100 Q675 150 900 90"/>
    <path d="M0 40 Q225 100 450 50 Q675 100 900 40"/>
  </g>
  <g fill="url(#g8Glow)">
    <circle cx="110" cy="108" r="7"/><circle cx="230" cy="132" r="7"/><circle cx="345" cy="112" r="7"/><circle cx="450" cy="102" r="7"/><circle cx="560" cy="112" r="7"/><circle cx="675" cy="132" r="7"/><circle cx="790" cy="108" r="7"/>
    <circle cx="160" cy="60" r="6"/><circle cx="300" cy="84" r="6"/><circle cx="450" cy="52" r="6"/><circle cx="600" cy="84" r="6"/><circle cx="740" cy="60" r="6"/>
  </g>
  <g fill="#f9f3e2" opacity=".28">
    <circle cx="450" cy="102" r="26"/><circle cx="230" cy="132" r="22"/><circle cx="675" cy="132" r="22"/>
  </g>
  <!-- dancing couple silhouettes -->
  <g transform="translate(450 400)">
    <!-- gown -->
    <path d="M-46 190 Q-70 90 -40 30 L40 30 Q70 90 46 190 Z" fill="url(#g8Gown)"/>
    <path d="M-40 30 Q0 6 40 30" stroke="#c9b58e" stroke-width="2" fill="none"/>
    <circle cx="0" cy="0" r="26" fill="#c9a98e"/>
    <path d="M0 -28 q-28 2 -30 34 q10 -16 30 -18 q20 2 30 18 q-2 -32 -30 -34" fill="#4a3a2c"/>
    <!-- groom -->
    <path d="M52 190 V70 Q52 34 82 34 Q112 34 112 70 V190 Z" fill="#332c24"/>
    <circle cx="82" cy="10" r="24" fill="#c9a98e"/>
    <path d="M82 -16 q-26 2 -28 30 q10 -14 28 -16 q18 2 28 16 q-2 -28 -28 -30" fill="#241f19"/>
    <!-- arms -->
    <path d="M22 34 Q60 44 84 52" stroke="#c9a98e" stroke-width="9" fill="none" stroke-linecap="round"/>
    <path d="M56 60 Q30 66 10 52" stroke="#332c24" stroke-width="9" fill="none" stroke-linecap="round"/>
  </g>
  <!-- soft floor reflection -->
  <ellipse cx="450" cy="612" rx="200" ry="16" fill="#f6e2ae" opacity=".14"/>
  <!-- foreground botanicals, dark -->
  <g stroke="#55604a" stroke-width="2" fill="none" opacity=".8">
    <path d="M70 640 Q90 560 70 480 M830 640 Q810 560 830 480"/>
  </g>
  <g fill="#4c573f" opacity=".9">
    <ellipse cx="94" cy="520" rx="20" ry="8" transform="rotate(18 94 520)"/>
    <ellipse cx="66" cy="460" rx="20" ry="8" transform="rotate(-16 66 460)"/>
    <ellipse cx="806" cy="520" rx="20" ry="8" transform="rotate(-18 806 520)"/>
    <ellipse cx="834" cy="460" rx="20" ry="8" transform="rotate(16 834 460)"/>
  </g>
  <g fill="#d8b2a6" opacity=".5"><circle cx="80" cy="600" r="6"/><circle cx="820" cy="600" r="6"/></g>
  <rect width="900" height="640" filter="url(#g8Grain)" opacity=".5"/>
</svg>
