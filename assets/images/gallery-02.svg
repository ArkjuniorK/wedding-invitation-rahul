<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Galeri 2 - lanskap taman akad">
  <defs>
    <linearGradient id="g2Sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f3ead8"/><stop offset="1" stop-color="#e2d3b6"/></linearGradient>
    <linearGradient id="g2Ground" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b9b795"/><stop offset="1" stop-color="#8d9270"/></linearGradient>
    <linearGradient id="g2Leaf" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8a9172"/><stop offset="1" stop-color="#55604a"/></linearGradient>
    <filter id="g2Grain"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="matrix" values="0 0 0 0 .4 0 0 0 0 .36 0 0 0 0 .28 0 0 0 .05 0"/></filter>
  </defs>
  <rect width="1000" height="700" fill="url(#g2Sky)"/>
  <circle cx="500" cy="230" r="90" fill="#f8f2e2" stroke="#c9a98e" stroke-width="2"/>
  <path d="M0 430 Q250 380 500 420 Q750 460 1000 410 V700 H0 Z" fill="url(#g2Ground)"/>
  <!-- pergola arches -->
  <g stroke="#7d6a4e" stroke-width="3" fill="none" opacity=".85">
    <path d="M120 430 V260 A80 80 0 0 1 280 260 V430"/>
    <path d="M420 420 V240 A80 80 0 0 1 580 240 V420"/>
    <path d="M720 430 V260 A80 80 0 0 1 880 260 V430"/>
  </g>
  <g stroke="#7d6a4e" stroke-width="2" fill="none" opacity=".7">
    <path d="M110 300 H290 M410 280 H590 M710 300 H890"/>
  </g>
  <!-- climbing vines -->
  <g stroke="#5d684f" stroke-width="1.8" fill="none" opacity=".9">
    <path d="M150 430 Q170 360 150 300 Q170 250 152 200"/>
    <path d="M450 420 Q468 350 450 300 Q468 250 452 200"/>
    <path d="M750 430 Q770 360 750 300 Q770 250 752 200"/>
  </g>
  <g fill="url(#g2Leaf)" opacity=".9">
    <ellipse cx="168" cy="360" rx="12" ry="5" transform="rotate(24 168 360)"/><ellipse cx="148" cy="300" rx="12" ry="5" transform="rotate(-20 148 300)"/><ellipse cx="166" cy="240" rx="12" ry="5" transform="rotate(20 166 240)"/>
    <ellipse cx="468" cy="350" rx="12" ry="5" transform="rotate(24 468 350)"/><ellipse cx="448" cy="300" rx="12" ry="5" transform="rotate(-20 448 300)"/><ellipse cx="466" cy="240" rx="12" ry="5" transform="rotate(20 466 240)"/>
    <ellipse cx="768" cy="360" rx="12" ry="5" transform="rotate(24 768 360)"/><ellipse cx="748" cy="300" rx="12" ry="5" transform="rotate(-20 748 300)"/><ellipse cx="766" cy="240" rx="12" ry="5" transform="rotate(20 766 240)"/>
  </g>
  <!-- hanging florals -->
  <g fill="#d8b2a6" opacity=".85">
    <circle cx="200" cy="312" r="7"/><circle cx="212" cy="298" r="5"/><circle cx="500" cy="292" r="7"/><circle cx="512" cy="278" r="5"/><circle cx="800" cy="312" r="7"/><circle cx="812" cy="298" r="5"/>
  </g>
  <!-- foreground flower bed -->
  <g stroke="#55604a" stroke-width="2" fill="none">
    <path d="M80 700 V600 M180 700 V580 M280 700 V596 M720 700 V584 M820 700 V600 M920 700 V580"/>
  </g>
  <g fill="#d8b2a6"><circle cx="80" cy="594" r="9"/><circle cx="180" cy="574" r="9"/><circle cx="280" cy="590" r="9"/><circle cx="720" cy="578" r="9"/><circle cx="820" cy="594" r="9"/><circle cx="920" cy="574" r="9"/></g>
  <g fill="#c99a8e"><circle cx="80" cy="594" r="4"/><circle cx="180" cy="574" r="4"/><circle cx="280" cy="590" r="4"/><circle cx="720" cy="578" r="4"/><circle cx="820" cy="594" r="4"/><circle cx="920" cy="574" r="4"/></g>
  <rect width="1000" height="700" filter="url(#g2Grain)" opacity=".5"/>
</svg>
