<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Galeri 4 - meja dekorasi resepsi">
  <defs>
    <linearGradient id="g4Bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f2e8d4"/><stop offset="1" stop-color="#d8c8aa"/></linearGradient>
    <linearGradient id="g4Cloth" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fbf7ec"/><stop offset="1" stop-color="#e8dcc2"/></linearGradient>
    <linearGradient id="g4Leaf" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8a9172"/><stop offset="1" stop-color="#55604a"/></linearGradient>
    <filter id="g4Grain"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="matrix" values="0 0 0 0 .4 0 0 0 0 .36 0 0 0 0 .28 0 0 0 .05 0"/></filter>
  </defs>
  <rect width="900" height="620" fill="url(#g4Bg)"/>
  <!-- table -->
