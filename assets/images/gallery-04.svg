    <ellipse cx="420" cy="200" rx="14" ry="6" transform="rotate(28 420 200)"/>
    <ellipse cx="500" cy="212" rx="13" ry="6" transform="rotate(-14 500 212)"/>
    <ellipse cx="410" cy="228" rx="13" ry="6" transform="rotate(22 410 228)"/>
  </g>
  <g fill="#d8b2a6"><circle cx="456" cy="144" r="12"/><circle cx="472" cy="166" r="8"/><circle cx="440" cy="168" r="8"/></g>
  <g fill="#c99a8e"><circle cx="456" cy="144" r="5"/></g>
  <!-- candles -->
  <g>
    <rect x="250" y="270" width="18" height="60" fill="#f8f2e0" stroke="#c9b58e"/>
    <rect x="632" y="270" width="18" height="60" fill="#f8f2e0" stroke="#c9b58e"/>
    <ellipse cx="259" cy="264" rx="7" ry="10" fill="#e8b96a"/><ellipse cx="259" cy="262" rx="3" ry="5" fill="#f6e2ae"/>
    <ellipse cx="641" cy="264" rx="7" ry="10" fill="#e8b96a"/><ellipse cx="641" cy="262" rx="3" ry="5" fill="#f6e2ae"/>
  </g>
  <!-- place cards -->
  <g fill="#fbf7ec" stroke="#c9b58e">
    <rect x="170" y="300" width="46" height="30" transform="rotate(-4 193 315)"/>
    <rect x="540" y="300" width="46" height="30" transform="rotate(3 563 315)"/>
