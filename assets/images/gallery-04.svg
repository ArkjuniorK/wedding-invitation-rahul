    <ellipse cx="300" cy="332" rx="18" ry="7" transform="rotate(-8 300 332)"/>
    <ellipse cx="340" cy="336" rx="16" ry="7" transform="rotate(6 340 336)"/>
    <ellipse cx="560" cy="334" rx="18" ry="7" transform="rotate(8 560 334)"/>
